<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bela Card Table</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #123D2F; color: #E8F0EA; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #0C2A20">
<a href="Main.dc.html" aria-label="Leave table" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8F0EA" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="display: flex; gap: 8px; align-items: stretch">
<div style="background: #17493A; border-radius: 12px; padding: 6px 14px; display: flex; flex-direction: column; align-items: center; min-width: 56px"><span style="font-size: 12px; color: #B7CCC0; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Us</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">312</span></div>
<div style="background: #17493A; border-radius: 12px; padding: 6px 14px; display: flex; flex-direction: column; align-items: center; min-width: 56px"><span style="font-size: 12px; color: #B7CCC0; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Them</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">287</span></div>
</div>
<div style="background: #FBFAF5; color: #14201B; border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; align-items: center; min-width: 56px"><span style="font-size: 12px; color: #4A5A52; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Trump</span><span style="font-size: 24px; line-height: 1.1; font-weight: 700">&#9824;&#xFE0E;</span></div>
</div>
<div style="flex: 1; position: relative">
<div style="position: absolute; top: 24px; left: 0; right: 0; display: flex; justify-content: center">
<div style="background: #0C2A20; border-radius: 16px; padding: 8px 14px; display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #E7B84B; color: #1A1405; font-weight: 700; display: flex; align-items: center; justify-content: center">M</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Marta</span><span style="font-size: 12px; color: #9DB5A8">Partner · 5 cards</span></div>
</div>
</div>
<div style="position: absolute; left: 10px; top: 250px; background: #0C2A20; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; box-sizing: border-box">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #5C8DFF; color: #0A1330; font-weight: 700; display: flex; align-items: center; justify-content: center">I</div>
<span style="font-size: 14px; font-weight: 700">Ivo</span><span style="font-size: 12px; color: #9DB5A8">5 cards</span>
</div>
<div style="position: absolute; right: 10px; top: 250px; background: #0C2A20; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; box-sizing: border-box">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #E8F0EA; color: #0C2A20; font-weight: 700; display: flex; align-items: center; justify-content: center">A</div>
<span style="font-size: 14px; font-weight: 700">Ana</span><span style="font-size: 12px; color: #9DB5A8">5 cards</span>
</div>
<div style="position: absolute; left: 167px; top: 150px; width: 56px; height: 80px; border-radius: 8px; background: #FBFAF5; color: #C23A2E; box-shadow: 0 3px 8px rgba(0,0,0,0.35); box-sizing: border-box; padding: 6px 7px; font-weight: 700; font-size: 18px; line-height: 1">K<br><span style="font-size: 20px">&#9830;&#xFE0E;</span></div>
<div style="position: absolute; left: 96px; top: 218px; width: 56px; height: 80px; border-radius: 8px; background: #FBFAF5; color: #C23A2E; box-shadow: 0 3px 8px rgba(0,0,0,0.35); box-sizing: border-box; padding: 6px 7px; font-weight: 700; font-size: 18px; line-height: 1; transform: rotate(-6deg)">10<br><span style="font-size: 20px">&#9830;&#xFE0E;</span></div>
<div style="position: absolute; left: 238px; top: 218px; width: 56px; height: 80px; border-radius: 8px; background: #FBFAF5; color: #C23A2E; box-shadow: 0 3px 8px rgba(0,0,0,0.35); box-sizing: border-box; padding: 6px 7px; font-weight: 700; font-size: 18px; line-height: 1; transform: rotate(5deg)">7<br><span style="font-size: 20px">&#9830;&#xFE0E;</span></div>
<div style="position: absolute; left: 167px; top: 290px; width: 56px; height: 80px; border-radius: 8px; border: 2px dashed #E7B84B; box-sizing: border-box"></div>
<div style="position: absolute; left: 0; right: 0; top: 392px; text-align: center; font-size: 15px; color: #E7B84B; font-weight: 700">Your turn: follow suit with a diamond</div>
</div>
<div style="background: #0C2A20; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 112px">
<sc-for list="{{hand}}" as="c" hint-placeholder-count="6">
<div style="{{c.style}}"><span>{{c.rank}}</span><span style="font-size: 20px">{{c.suit}}</span></div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; color: #9DB5A8">Tap a lit card, then confirm</span>
<button style="min-height: 44px; padding: 0 20px; border-radius: 14px; border: 0; background: #E7B84B; color: #1A1405; font-family: inherit; font-weight: 700; font-size: 15px">Play A&#9830;&#xFE0E;</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const S = { s: '♠︎', h: '♥︎', d: '♦︎', c: '♣︎' };
const cards = [
['Q', 'c', false], ['K', 'h', false], ['9', 's', false],
['J', 's', false], ['8', 'd', true], ['A', 'd', true]
];
const hand = cards.map((x, i) => {
const red = x[1] === 'h' || x[1] === 'd';
const lift = x[2] ? 'translateY(-14px)' : 'none';
const base = 'position:absolute;left:' + (i * 60) + 'px;top:14px;width:56px;height:84px;border-radius:8px;box-sizing:border-box;padding:6px 7px;font-weight:700;font-size:18px;line-height:1;display:flex;flex-direction:column;box-shadow:0 3px 8px rgba(0,0,0,0.4);';
const look = x[2]
? 'background:#FBFAF5;border:2px solid #E7B84B;transform:' + lift + ';color:' + (red ? '#C23A2E' : '#14201B') + ';'
: 'background:#8FA39A;color:' + (red ? '#7A2A24' : '#1B2A24') + ';';
return { rank: x[0], suit: S[x[1]], style: base + look };
});
return { hand };
}
}
</script>
</body>
</html>
