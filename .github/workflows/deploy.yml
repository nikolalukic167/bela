name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (and deploy Convex functions once configured)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            case "$CONVEX_DEPLOY_KEY" in
              prod:*) ;;
              *) echo "::error::CONVEX_DEPLOY_KEY must be a production key (starts with prod:). Generate one under Production → Settings in the Convex dashboard."; exit 1 ;;
            esac
            npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL
          else
            echo "CONVEX_DEPLOY_KEY not set – building without online features"
            npm run build
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
