name: Convex auth setup

# Run once from the Actions tab after adding the CONVEX_DEPLOY_KEY secret.
# Generates the sign-in signing keys and sets SITE_URL on the Convex
# production deployment. Keys never appear in logs.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: URL of the site (no trailing slash)
        default: https://nikolalukic167.github.io/bela
        required: true
      force:
        description: Rotate existing keys (signs everyone out)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set JWT keys and SITE_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SITE_URL: ${{ inputs.site_url }}
          FORCE: ${{ inputs.force }}
        run: node scripts/convex-auth-setup.mjs
